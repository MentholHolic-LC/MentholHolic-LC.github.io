<text x="32" y="116" font-size="19" fill="#a8b9b6" text-anchor="start" font-weight="400">对应 2.4  /  从“反制成功”到“收益兑现”</text>
<text x="44" y="170" font-size="21" fill="#98dfc9" text-anchor="start" font-weight="600">对单：注意力集中</text><rect x="44" y="195" width="184" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="136.0" y="231" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">识别 A</text><text x="136.0" y="262" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">读取起手</text><rect x="268" y="195" width="184" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="360.0" y="231" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">反制 A</text><text x="360.0" y="262" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">制造机会</text><rect x="492" y="195" width="184" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="584.0" y="231" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">追击 A</text><text x="584.0" y="262" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">兑现收益</text><path d="M228 241H262" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M452 241H486" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><text x="44" y="346" font-size="21" fill="#f29b98" text-anchor="start" font-weight="600">对群：还要处理其他输出源</text><rect x="44" y="374" width="184" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="136.0" y="410" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">识别 A</text><text x="136.0" y="441" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">注意力被分配</text><rect x="268" y="374" width="184" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="360.0" y="410" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">反制 A</text><text x="360.0" y="441" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">局部成功</text><rect x="492" y="374" width="184" height="92" rx="14" fill="#162122" stroke="#f29b98" stroke-opacity=".55"/><text x="584.0" y="410" font-size="24" fill="#f29b98" text-anchor="middle" font-weight="600">追击 A？</text><text x="584.0" y="441" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">重新检查安全性</text><path d="M228 420H262" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M452 420H486" fill="none" stroke="#f29b98" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#red)"/><rect x="224" y="534" width="272" height="92" rx="14" fill="#162122" stroke="#f29b98" stroke-opacity=".55"/><text x="360.0" y="570" font-size="24" fill="#f29b98" text-anchor="middle" font-weight="600">B / C 同时攻击</text><text x="360.0" y="601" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">侧面 · 远程 · 视野外</text><path d="M496 580H584V472" fill="none" stroke="#f29b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><text x="360" y="668" font-size="23" fill="#98dfc9" text-anchor="middle" font-weight="600">一次反制成功 ≠ 后续追击已经得到保护</text><text x="360" y="704" font-size="20" fill="#a8b9b6" text-anchor="middle" font-weight="400">先用移动与减员整理局面，再兑现局部机会。</text>
<path d="M32 738H688" stroke="#304241"/>
<text x="32" y="762" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">机制关系示意 · 沿用正文术语 · 非帧数或数值实测</text>
