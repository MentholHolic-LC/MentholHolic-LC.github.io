<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650" role="img" aria-labelledby="title desc">
<title id="title">断肢：机会与威胁同时出现</title><desc id="desc">制造断肢后，能安全收割则处决减员，无法收割则敌人仍有反击风险。两种情况都需要重新判断位置和其他敌人。</desc>
<defs><marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98dfc9"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f29b98"/></marker></defs>
<rect width="720" height="650" rx="20" fill="#0c1112"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<text x="32" y="39" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">NINJA GAIDEN 4  /  战斗设计</text>
<text x="32" y="82" font-size="30" fill="#eef4f2" text-anchor="start" font-weight="700">断肢：机会与威胁同时出现</text>
<text x="32" y="116" font-size="19" fill="#a8b9b6" text-anchor="start" font-weight="400">对应 1.2.2  /  打出破绽，不等于已经安全</text>
<rect x="190" y="151" width="340" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="360.0" y="187" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">攻击制造断肢</text><text x="360.0" y="218" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">敌人进入可处决状态</text><path d="M360 243V283H185V319" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M360 283H535V319" fill="none" stroke="#f29b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><text x="185" y="274" font-size="19" fill="#98dfc9" text-anchor="middle" font-weight="400">有条件收割</text><text x="535" y="274" font-size="19" fill="#f29b98" text-anchor="middle" font-weight="400">暂时无法收割</text><rect x="50" y="325" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="185.0" y="361" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">完成灭却（OT）</text><text x="185.0" y="392" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">终结目标 · 移除威胁</text><rect x="400" y="325" width="270" height="92" rx="14" fill="#162122" stroke="#f29b98" stroke-opacity=".55"/><text x="535.0" y="361" font-size="24" fill="#f29b98" text-anchor="middle" font-weight="600">断肢敌人仍存活</text><text x="535.0" y="392" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">继续反击 · 保留风险</text><path d="M185 417V452H354V481" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M535 417V452H366V481" fill="none" stroke="#f29b98" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#red)"/><rect x="130" y="487" width="460" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="360.0" y="523" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">重新判断位置与目标</text><text x="360.0" y="554" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">其他敌人的攻击仍需纳入决策</text>
<path d="M32 608H688" stroke="#304241"/>
<text x="32" y="632" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">机制关系示意 · 沿用正文术语 · 非帧数或数值实测</text>
</g></svg>