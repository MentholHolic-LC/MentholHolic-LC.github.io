<svg xmlns="http://www.w3.org/2000/svg" width="720" height="690" viewBox="0 0 720 690" role="img" aria-labelledby="title desc">
<title id="title">两套系统，汇入同一场面收益</title><desc id="desc">吸魂必杀偏向处理场面，断肢灭却偏向快速终结单点，两者共同带来减员、喘息和重新选位的机会。</desc>
<defs><marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98dfc9"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f29b98"/></marker></defs>
<rect width="720" height="690" rx="20" fill="#0c1112"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<text x="32" y="39" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">NINJA GAIDEN 4  /  战斗设计</text>
<text x="32" y="82" font-size="30" fill="#eef4f2" text-anchor="start" font-weight="700">两套系统，汇入同一场面收益</text>
<text x="32" y="116" font-size="19" fill="#a8b9b6" text-anchor="start" font-weight="400">对应 1.2.3  /  从单点终结到整体减压</text>
<rect x="190" y="151" width="340" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="360.0" y="187" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">多个敌人同时施压</text><text x="360.0" y="218" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">先争取可操作的局部空间</text><path d="M360 243V274H185V308" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M360 274H535V308" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><rect x="50" y="314" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="185.0" y="350" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">吸魂 → 必杀</text><text x="185.0" y="381" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">处理场面 · 扩大攻击收益</text><rect x="400" y="314" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="535.0" y="350" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">断肢 → 灭却</text><text x="535.0" y="381" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">处理单点 · 加快终结</text><path d="M185 406V444H354V474" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M535 406V444H366V474" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><rect x="130" y="480" width="460" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="360.0" y="516" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">减员 + 喘息 + 重新选位</text><text x="360.0" y="547" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">让下一次进攻更容易组织</text><text x="360" y="611" font-size="21" fill="#98dfc9" text-anchor="middle" font-weight="400">共同目标：降低同时需要处理的威胁。</text>
<path d="M32 648H688" stroke="#304241"/>
<text x="32" y="672" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">机制关系示意 · 沿用正文术语 · 非帧数或数值实测</text>
</g></svg>