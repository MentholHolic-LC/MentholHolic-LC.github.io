<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c1112">
  <title>{% if page.title != '首页' %}{{ page.title | escape }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  <script defer src="{{ '/assets/blog.js' | relative_url }}"></script>
<link rel="stylesheet" href="{{ '/assets/hero.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/theme.css' | relative_url }}">
<script defer src="{{ '/assets/aurora.js' | relative_url }}"></script>
<script defer src="{{ '/assets/theme.js' | relative_url }}"></script>
</head>
<body{% if page.nav == 'home' %} class="home-page"{% endif %}>
<div class="site-backdrop" aria-hidden="true"><div class="theme-portrait"><img src="{{ '/assets/images/miku-reference.png' | relative_url }}" alt="" width="716" height="1200"></div><div class="aurora-container"><canvas class="aurora-canvas"></canvas></div><div class="theme-shade"></div><div class="theme-texture"></div></div>
<button class="aurora-toggle theme-motion" type="button" aria-pressed="false" aria-label="暂停极光动画">Ⅱ <span>AURORA ON</span></button>
<a class="skip-link" href="#main">跳至正文</a>
<header class="header shell">
  <a class="brand" href="{{ '/index.html' | relative_url }}" aria-label="MENTHOLHOLIC 首页"><svg class="brand-emblem" viewBox="0 0 42 36" fill="none" aria-hidden="true"><path d="M2 31 11 4 21 21 31 4 40 31M1 34h40" stroke="currentColor" stroke-width="2"/></svg><span class="brand-word">MENTHOL<span>HOLIC</span><sup>®</sup></span></a>
  <nav aria-label="主导航"><a {% if page.nav == 'home' %}aria-current="page"{% endif %} href="{{ '/index.html' | relative_url }}">首页</a><a {% if page.nav == 'archives' %}aria-current="page"{% endif %} href="{{ '/archives.html' | relative_url }}">文章归档</a><a {% if page.nav == 'about' %}aria-current="page"{% endif %} href="{{ '/about.html' | relative_url }}">关于我</a><a href="https://github.com/MentholHolic-LC" target="_blank" rel="noreferrer">GitHub ↗</a></nav>
  <a class="rss-link" href="{{ '/feed.xml' | relative_url }}" title="订阅 RSS">◉ <span>RSS</span></a>
</header>
<main id="main">{{ content }}</main>
<footer class="footer shell"><div><a href="{{ '/index.html' | relative_url }}">MentholHolic<span>_</span></a><p>保持好奇。慢慢记录。</p></div><div class="footer-note">© {{ site.time | date: '%Y' }} MentholHolic<br>BUILT WITH JEKYLL · TUNED TO 39Hz</div><a class="back-top" href="#">回到顶部 ↑</a></footer>
</body>
</html>
