<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548" role="img" aria-labelledby="title desc">
<title id="title">吸魂循环：战果成为下一轮的起点</title><desc id="desc">击杀产生魂，吸魂加速蓄力，释放必杀争取减员与喘息，再选择下一目标。</desc>
<defs><marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98dfc9"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f29b98"/></marker></defs>
<rect width="720" height="548" rx="20" fill="#0c1112"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<text x="32" y="39" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">NINJA GAIDEN 4  /  战斗设计</text>
<text x="32" y="82" font-size="30" fill="#eef4f2" text-anchor="start" font-weight="700">吸魂循环：战果成为下一轮的起点</text>
<text x="32" y="116" font-size="19" fill="#a8b9b6" text-anchor="start" font-weight="400">对应 1.2.1  /  减员、资源与决策的连续关系</text>
<rect x="50" y="154" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="185.0" y="190" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">01  击杀敌人</text><text x="185.0" y="221" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">产生可利用的魂</text><rect x="400" y="154" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="535.0" y="190" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">02  吸魂蓄力</text><text x="535.0" y="221" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">加速必杀的准备</text><rect x="400" y="332" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="535.0" y="368" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">03  释放必杀</text><text x="535.0" y="399" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">攻击敌人 · 争取喘息</text><rect x="50" y="332" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="185.0" y="368" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">04  减员与再判断</text><text x="185.0" y="399" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">选择下一轮处理目标</text><path d="M320 200H394" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M535 246V326" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M400 378H326" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M185 332V252" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><text x="360" y="290" font-size="21" fill="#98dfc9" text-anchor="middle" font-weight="400">把击杀成果投入下一轮进攻</text><text x="360" y="474" font-size="19" fill="#a8b9b6" text-anchor="middle" font-weight="400">无敌窗口在必杀释放阶段；吸魂准备仍需判断时机。</text>
<path d="M32 506H688" stroke="#304241"/>
