<svg xmlns="http://www.w3.org/2000/svg" width="720" height="669" viewBox="0 0 720 669" role="img" aria-labelledby="title desc">
<title id="title">红光应对：资源改变可选路线</title><desc id="desc">识别强力攻击后，根据距离、时机和资源，选择回避或使用强化形态反制，随后判断实际进攻窗口。此图概括主要路线，并非完整招式表。</desc>
<defs><marker id="mint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#98dfc9"/></marker>
<marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#f29b98"/></marker></defs>
<rect width="720" height="669" rx="20" fill="#0c1112"/>
<g font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
<text x="32" y="39" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">NINJA GAIDEN 4  /  战斗设计</text>
<text x="32" y="82" font-size="30" fill="#eef4f2" text-anchor="start" font-weight="700">红光应对：资源改变可选路线</text>
<text x="32" y="116" font-size="19" fill="#a8b9b6" text-anchor="start" font-weight="400">对应 2.1—2.3  /  从识别威胁到安排反击</text>
<rect x="170" y="151" width="380" height="92" rx="14" fill="#162122" stroke="#f29b98" stroke-opacity=".55"/><text x="360.0" y="187" font-size="24" fill="#f29b98" text-anchor="middle" font-weight="600">识别强力攻击的预警</text><text x="360.0" y="218" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">先看距离、起手与剩余量表</text><path d="M360 243V279H185V312" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M360 279H535V312" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><text x="185" y="270" font-size="19" fill="#98dfc9" text-anchor="middle" font-weight="400">保留资源</text><text x="535" y="270" font-size="19" fill="#98dfc9" text-anchor="middle" font-weight="400">投入资源</text><rect x="50" y="318" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="185.0" y="354" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">闪避 / 脱离范围</text><text x="185.0" y="385" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">避开攻击，再观察收招</text><rect x="400" y="318" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="535.0" y="354" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">切入强化形态</text><text x="535.0" y="385" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">选择适用的反制动作</text><path d="M185 410V454" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><path d="M535 410V454" fill="none" stroke="#98dfc9" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#mint)"/><rect x="50" y="460" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="185.0" y="496" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">寻找后续机会</text><text x="185.0" y="527" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">调整位置 · 判断能否追击</text><rect x="400" y="460" width="270" height="92" rx="14" fill="#162122" stroke="#98dfc9" stroke-opacity=".55"/><text x="535.0" y="496" font-size="24" fill="#98dfc9" text-anchor="middle" font-weight="600">成功打断或防御</text><text x="535.0" y="527" font-size="19" fill="#eef4f2" text-anchor="middle" font-weight="400">按实际硬直安排反击</text><text x="360" y="594" font-size="19" fill="#a8b9b6" text-anchor="middle" font-weight="400">反制取决于招式与时机，强化态不等于自动成功。</text>
<path d="M32 627H688" stroke="#304241"/>
<text x="32" y="651" font-size="14" fill="#a8b9b6" text-anchor="start" font-weight="400">机制关系示意 · 沿用正文术语 · 非帧数或数值实测</text>
</g></svg>